{% extends "base.html" %}

{% block title %}{{ title }} — Basecamp Radar{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12">
  <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 text-center space-y-4">
    <div class="w-12 h-12 mx-auto bg-amber-500/20 rounded-full flex items-center justify-center">
      <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-500"></i>
    </div>
    <h1 class="text-lg font-semibold text-white">{{ title }}</h1>
    <p class="text-sm text-slate-300">{{ message }}</p>
    <a href="/settings" class="inline-block mt-2 px-4 py-2 text-sm bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-colors">&larr; Back to Settings</a>
  </div>
</div>
{% endblock %}
